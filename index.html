:root{
  --blue:#006bd3; --blue-press:#005bb5; --dark-blue:#093675; --light-blue:#d9eaf9; --medium-blue:#80b5e9;
  --tint:#f3f7fc; --app-bg:#f1f3f6; --surface:#fff; --border:#e2e8ef; --border-strong:#c9d2dc; --divider:#ebeef2;
  --ink:#093675; --fg:#1a1d21; --muted:#5f6670; --subtle:#6d7279; --chip:#e9edf2;
  --red:#c8302c; --red-dot:#df3935; --green:#23863a; --gold:#ecc42f; --gold-deep:#f17a22;
  --shadow-1:0 1px 2px rgba(13,38,76,.06),0 1px 1px rgba(13,38,76,.04);
  --shadow-2:0 4px 12px rgba(13,38,76,.08),0 1px 2px rgba(13,38,76,.04);
  --shadow-3:0 12px 32px rgba(13,38,76,.12),0 2px 6px rgba(13,38,76,.06);
  --ease:cubic-bezier(.16,1,.3,1);
  --r-md:4px; --r-lg:8px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#e9eef4;font-family:"Roboto",Arial,sans-serif;color:var(--fg);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
button:active{opacity:.85}
svg{display:block;flex:none}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Stage ---------- */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#f7f9fc 0%,#e6edf5 100%)}
#brandPanel{position:absolute;left:4vw;top:50%;transform:translateY(-50%);max-width:28vw;color:var(--dark-blue)}
#brandPanel .word{font-size:clamp(28px,3.2vw,64px);font-weight:600;letter-spacing:-.01em;line-height:1.05;color:var(--blue)}
#brandPanel .word b{font-weight:800}
#brandPanel p{font-size:clamp(16px,1.3vw,26px);font-weight:300;color:var(--muted);line-height:1.45;margin:.8em 0 0}
#brandPanel .eyebrow{font-size:clamp(12px,.9vw,18px);letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--blue);margin-bottom:1em}
#deviceWrap{position:relative;transform-origin:center center}
#device{width:414px;height:868px;border-radius:58px;background:#11161d;padding:12px;box-shadow:0 30px 80px rgba(13,38,76,.28),0 0 0 2px #2b323c inset}
#screen{position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;background:var(--app-bg)}
body.frameless #device{width:390px;height:844px;padding:0;border-radius:0;background:none;box-shadow:var(--shadow-3)}
body.frameless #screen{border-radius:0}
body.frameless #brandPanel{display:none}
body.hidebrand #brandPanel{display:none}

/* ---------- Status bar ---------- */
#statusbar{position:absolute;top:0;left:0;right:0;height:50px;z-index:40;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 8px 44px;font-weight:600;font-size:16px;color:#000;pointer-events:none}
#statusbar .r{display:flex;gap:6px;align-items:center}
#island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000;z-index:41;pointer-events:none}
body.frameless #island{display:none}

/* ---------- Views ---------- */
#views{position:absolute;inset:0}
.view{position:absolute;inset:0;background:var(--app-bg);display:flex;flex-direction:column;padding-top:50px;will-change:transform}
.view.white{background:#fff}
.view.enter{animation:pushIn .34s var(--ease) both}
.view.leave{animation:pushOut .3s var(--ease) both}
.view.fade{animation:fadeIn .22s var(--ease) both}
.view.under{animation:dimBack .34s var(--ease) both}
@keyframes pushIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes pushOut{from{transform:none}to{transform:translateX(100%)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes dimBack{from{transform:none}to{transform:translateX(-25%)}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar,.hscroll::-webkit-scrollbar{display:none}
.hscroll{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;overscroll-behavior-x:contain}
.scoreband .hscroll{scroll-snap-type:x proximity;scroll-padding:0 14px}
.dragging,.dragging *{cursor:grabbing !important}
.pad-tab{height:110px}

/* ---------- Headers ---------- */
.hdr{display:flex;align-items:center;gap:6px;height:52px;padding:0 12px;background:#fff;border-bottom:1px solid var(--divider);flex:none}
.hdr.plain{background:transparent;border:0}
.hdr .back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--ink);margin-left:-6px}
.hdr .back .ic{width:22px;height:22px}
.hdr h1{margin:0;font-size:21px;font-weight:600;color:var(--ink);letter-spacing:-.01em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr h1 small{font-size:14px;font-weight:400;color:var(--subtle);margin-left:6px}
.hdr.center h1{text-align:center;font-size:17px;margin-right:38px}
.hdr .link{color:var(--blue);font-weight:600;font-size:14px;padding:12px 6px}
.hdr .iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.bigtitle{font-size:32px;font-weight:700;color:var(--ink);margin:4px 18px 12px;letter-spacing:-.01em}

/* ---------- Home ---------- */
.homehdr{display:flex;align-items:center;justify-content:space-between;padding:6px 14px 10px;background:var(--app-bg)}
.logo{line-height:1;color:var(--blue);cursor:pointer}
.logo .l1{font-size:22px;font-weight:500;letter-spacing:-.01em}
.logo .l2{font-size:26px;font-weight:400;letter-spacing:-.02em;margin-top:1px}
.logo .l2 b{font-weight:800}
.logo sup{font-size:9px;vertical-align:top;margin-left:1px;font-weight:500}
.loc{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:#fff;border-radius:var(--r-lg);padding:6px 12px 6px 10px;max-width:160px;min-height:44px}
.loc .ic{width:16px;height:16px;color:var(--subtle)}
.loc .t{font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc .s{font-size:11px;color:var(--subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc>div{min-width:0}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--dark-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex:none;border:2px solid #fff;box-shadow:var(--shadow-1)}
.avatar.sm{width:26px;height:26px;font-size:10px;border:0;box-shadow:none;background:var(--blue)}
.hrow{display:flex;align-items:center;gap:10px}

.scoreband{background:#fff;padding:12px 0 14px;border-top:1px solid var(--divider);border-bottom:1px solid var(--divider)}
.sechead{display:flex;align-items:center;justify-content:space-between;padding:0 14px 10px}
.sechead h2{margin:0;font-size:19px;font-weight:600;color:var(--ink)}
.sechead button{width:44px;height:36px;display:flex;align-items:center;justify-content:flex-end;color:var(--ink)}
.sechead .ic{width:18px;height:18px}
.scards{display:flex;gap:10px;padding:0 14px}
.scard{flex:none;width:138px;height:104px;scroll-snap-align:start;border:1px solid var(--border-strong);border-radius:12px;padding:12px;display:flex;flex-direction:column;background:#fff}
.scard .lbl{font-size:14.5px;font-weight:600;color:var(--ink)}
.scard .val{font-size:24px;font-weight:600;color:var(--ink);margin-top:auto}
.scard .val.big{font-size:42px;color:var(--red);line-height:1}
.scard .sub{font-size:13px;color:var(--green);font-weight:500;margin-top:2px}
.scard .sub.gray{color:var(--subtle)}

.card{background:#fff;border-radius:var(--r-lg);border:1px solid var(--border);box-shadow:var(--shadow-1);margin:10px 12px 0;padding:14px}
.card h3{margin:0;font-size:18px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px}
.card h3 small{font-size:13px;font-weight:400;color:var(--subtle)}
.cardhead{display:flex;align-items:center;justify-content:space-between;min-height:28px}
.empty{color:var(--subtle);font-size:13px;text-align:center;padding:18px 8px}
.empty.dark{color:var(--fg);font-weight:500}
.meta{display:flex;gap:10px;font-size:12.5px;color:var(--ink)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:middle}
.actitem{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:var(--r-lg);padding:9px 10px;margin-top:8px;width:100%;position:relative}
.actitem.unread{border-color:var(--medium-blue)}
.actitem .ico{width:30px;height:30px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center;color:var(--blue)}
.actitem .ico .ic{width:16px;height:16px}
.actitem .t{font-size:13.5px;font-weight:500;color:var(--ink)}
.actitem .s{font-size:13px;color:var(--muted)}
.actitem .ago{position:absolute;right:10px;bottom:9px;font-size:11px;color:var(--subtle)}
.actitem .udot{position:absolute;right:10px;top:10px;width:7px;height:7px;border-radius:50%;background:var(--blue)}
.viewall{display:block;margin:10px auto 0;color:var(--blue);font-weight:600;font-size:14px;padding:6px 16px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 12px 0}
.duo .card{margin:0}
.minilbl{font-size:13px;color:var(--ink);font-weight:500;margin:12px 0 6px}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mini{background:var(--app-bg);border-radius:var(--r-lg);text-align:center;padding:7px 2px}
.mini b{display:block;font-size:16px;font-weight:500;color:var(--ink)}
.mini span{font-size:11px;color:var(--subtle)}
.tokhead{display:flex;align-items:center;gap:6px;font-size:18px;font-weight:600;color:var(--ink)}
.tokrow{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink);font-weight:500;background:var(--app-bg);border-radius:var(--r-md);padding:8px;margin-top:8px}
.tokrow b{color:var(--gold-deep);font-weight:600}
.tokempty{background:var(--light-blue);border-radius:var(--r-lg);padding:12px;margin-top:10px;font-size:13.5px;color:var(--dark-blue);line-height:1.4}

/* ---------- Tab bar ---------- */
#tabbar{position:absolute;left:12px;right:12px;bottom:22px;height:62px;background:#fff;border-radius:16px;box-shadow:var(--shadow-3);display:flex;z-index:30;border:1px solid var(--border);transition:transform .3s var(--ease),opacity .2s}
#tabbar.hidden{transform:translateY(120px);opacity:0;pointer-events:none}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--ink);font-weight:500}
#tabbar button .ic{width:23px;height:23px}
#tabbar button.on{color:var(--blue)}
#homeind{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#111;z-index:45;pointer-events:none}
body.frameless #homeind{display:none}

/* ---------- Lists ---------- */
.search{display:flex;align-items:center;gap:10px;margin:12px 12px 4px;height:44px;border:1px solid var(--border);border-radius:var(--r-lg);padding:0 14px;color:var(--subtle);font-size:14px;background:#fff}
.search .ic{width:16px;height:16px;color:var(--ink)}
.listsec{font-size:21px;font-weight:600;color:var(--ink);padding:16px 12px 6px}
.lrow{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 0 0 10px;border-bottom:1px solid var(--divider)}
.lrow .kind{color:var(--red);width:22px}
.lrow .kind .ic{width:20px;height:20px}
.lrow .add{width:36px;height:44px;display:flex;align-items:center;justify-content:center}
.plus{width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center}
.plus .ic{width:14px;height:14px;stroke-width:3}
.lrow .name{flex:1;font-size:14.5px;color:var(--red);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .time{font-size:12px;color:var(--red);border-left:1px solid var(--divider);padding:0 10px 0 6px;align-self:stretch;display:flex;align-items:center;min-width:70px;justify-content:flex-end}
.lrow.mine .kind,.lrow.mine .name,.lrow.mine .time{color:var(--ink)}
.lrow.mine .kind{color:var(--blue)}
.lrow.done .name{text-decoration:line-through;color:var(--subtle)}

/* ---------- Chips ---------- */
.chips{display:flex;gap:8px;padding:10px 12px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:var(--chip);font-size:14px;font-weight:600;color:var(--ink);flex:none}
.chip.out{background:#fff;border:1px solid var(--border);font-weight:500;font-size:13px;height:34px}
.chip.dark{background:var(--dark-blue);color:#fff}
.chip .ic{width:15px;height:15px}

/* ---------- Accountability ---------- */
.seg{display:flex;align-items:center;background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow-2);margin:12px;padding:12px}
.seg button{flex:1;text-align:center}
.seg .num{display:block;border-radius:var(--r-md);background:var(--chip);padding:6px;font-size:16px;font-weight:600;color:var(--subtle)}
.seg .on .num{background:var(--light-blue);color:var(--blue)}
.seg .cap{display:block;font-size:12px;color:var(--subtle);margin-top:6px}
.seg .sep{width:1px;height:40px;background:var(--border);margin:0 16px}
.panel{background:#fff;border-radius:var(--r-lg);margin:10px 12px 0;min-height:420px;box-shadow:var(--shadow-1);border:1px solid var(--border)}

/* ---------- Tabs ---------- */
.tabs{display:flex;justify-content:center;gap:28px;padding-bottom:6px}
.tabs button{font-size:15px;font-weight:500;color:var(--subtle);padding:8px 2px;border-bottom:2px solid transparent}
.tabs button.on{color:var(--blue);border-color:var(--blue)}
.center-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;min-height:520px}
.center-empty b{color:var(--ink);font-weight:600;font-size:15px}
.center-empty span{color:var(--subtle);font-size:14px;margin-top:6px}
.center-empty .bigic{width:44px;height:44px;color:var(--medium-blue);margin-bottom:12px;stroke-width:1.5}

/* ---------- Scoreboard detail ---------- */
.acc{display:flex;align-items:center;justify-content:space-between;width:100%;border:1px solid var(--border);background:var(--app-bg);border-radius:var(--r-lg);padding:12px;margin-top:8px;min-height:48px}
.acc .t{font-size:16px;font-weight:600;color:var(--ink)}
.acc .badge{display:flex;align-items:center;gap:6px;background:#fff;color:var(--blue);font-weight:600;padding:4px 8px;border-radius:var(--r-md);font-size:14px}
.acc .badge .ic{width:16px;height:16px;transition:transform .2s}
.acc.open .badge .ic{transform:rotate(180deg)}
.accbody{padding:4px 4px 0}
.accrow{display:flex;justify-content:space-between;font-size:13.5px;padding:9px 6px;border-bottom:1px solid var(--divider);color:var(--ink)}
.accrow span{color:var(--subtle)}
.stat{font-size:40px;font-weight:500;color:var(--ink);margin:14px 0 4px;line-height:1}
.statsub{font-size:12.5px;color:var(--subtle);line-height:1.35}
.legend{margin-top:14px}
.legend div{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--divider);font-size:14px;color:var(--ink);font-weight:500}
.legend i{display:inline-block;width:18px;height:18px;border-radius:50%;margin-right:10px;vertical-align:middle}
.cardbtn{display:block;width:100%;text-align:left}

/* ---------- Waste ---------- */
.wbanner{display:flex;align-items:center;justify-content:space-between;background:var(--blue);color:#fff;border-radius:var(--r-lg);margin:12px;padding:14px 16px;width:calc(100% - 24px);box-shadow:var(--shadow-2)}
.wbanner .t{font-size:23px;font-weight:700}
.wbanner .r{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:500}
.wtools{display:flex;align-items:center;gap:10px;padding:0 14px 6px}
.wtools .s{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 12px}
.witem{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-1);overflow:hidden}
.witem .n{text-align:center;font-weight:600;color:var(--ink);font-size:15px;padding:12px 6px 8px}
.witem .tb{margin:0 10px;background:var(--app-bg);border:1px solid var(--border);border-radius:var(--r-lg);text-align:center;padding:8px 4px 6px;width:calc(100% - 20px);display:block}
.witem .tb .p{display:flex;align-items:center;justify-content:center;gap:6px;font-size:16px;font-weight:600;color:var(--ink);height:28px}
.witem .tb .p .ic{width:18px;height:18px}
.witem .tb small{display:block;font-size:12px;color:var(--subtle);margin-top:2px}
.witem .tb.bump{animation:bump .3s var(--ease)}
@keyframes bump{0%{background:var(--light-blue)}100%{background:var(--app-bg)}}
.witem .tot{display:flex;justify-content:space-between;border-top:1px solid var(--divider);margin-top:10px;padding:8px 10px;font-size:13px;color:var(--subtle)}
.witem .tot b{color:var(--ink);font-weight:500}

/* ---------- To-Dos ---------- */
.week{display:flex;align-items:center;gap:6px;padding:4px 12px 12px;background:var(--app-bg)}
.week button.d{width:38px;height:38px;border-radius:50%;background:#fff;font-size:14px;color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:500;border:1px solid var(--border)}
.week button.d.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.week .vsep{width:1px;height:28px;background:var(--border-strong);margin:0 4px}
.week .cal{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--blue);display:flex;align-items:center;justify-content:center;border:1px solid var(--border)}
.week .cal .ic{width:16px;height:16px}
.coll{background:#fff;border-radius:var(--r-lg);margin:10px 12px 0;border:1px solid var(--border);box-shadow:var(--shadow-1)}
.coll>button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px;min-height:48px}
.coll .t{font-size:16px;font-weight:600;color:var(--ink)}
.coll .t span{font-weight:400;color:var(--subtle);margin-left:4px}
.coll .t.red{color:var(--red)} .coll .t.green{color:var(--green)}
.coll .ic{width:18px;height:18px;color:var(--subtle);transition:transform .2s}
.coll.open .ic{transform:rotate(180deg)}
.coll .body{border-top:1px solid var(--divider)}

/* ---------- Activity ---------- */
.eyebrowline{display:flex;align-items:center;gap:10px;margin:14px 18px 4px;font-size:13px;font-weight:600;color:var(--ink);letter-spacing:.06em}
.eyebrowline::after{content:"";flex:1;height:1px;background:var(--border)}

/* ---------- My Tasks ---------- */
.callout{display:flex;align-items:center;justify-content:space-between;background:var(--app-bg);border:1px solid var(--border);border-radius:var(--r-lg);margin:14px;padding:12px 14px;width:calc(100% - 28px)}
.callout b{font-size:13.5px;color:var(--ink);font-weight:600;display:block}
.callout span{font-size:12.5px;color:var(--subtle)}
.callout .ic{color:var(--subtle);width:18px;height:18px}
.msec{font-size:23px;font-weight:600;color:var(--ink);margin:20px 14px 0}
.msec.red{color:var(--red)}
.msec+.empty{padding:10px}

/* ---------- Tokens ---------- */
.tokbig{display:flex;align-items:center;gap:10px;font-size:32px;font-weight:600;color:var(--gold-deep);margin:14px 16px 4px}
.rowhead{display:flex;align-items:center;justify-content:space-between;margin:14px 16px 10px}
.rowhead h2{margin:0;font-size:24px;color:var(--ink);font-weight:600}
.rowhead .link{color:var(--blue);font-weight:600;font-size:14px;padding:8px 0}
.rewards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 14px}
.reward{border:1px solid var(--border);border-radius:var(--r-lg);text-align:center;padding:16px 6px 8px;background:#fff;box-shadow:var(--shadow-1)}
.reward .gi{color:var(--subtle);margin:0 auto 10px;width:30px;height:30px;stroke-width:1.6}
.reward.ok .gi{color:var(--blue)}
.reward .n{font-size:13px;color:var(--muted)}
.reward .c{display:flex;align-items:center;justify-content:center;gap:4px;font-weight:600;color:var(--ink);margin:6px 0 10px;font-size:15px}
.reward .st{border-top:1px solid var(--divider);padding-top:8px;font-size:13px;color:var(--subtle);display:flex;align-items:center;justify-content:center;gap:4px;min-height:36px}
.reward .st .ic{width:14px;height:14px}
.reward .st button{background:var(--blue);color:#fff;border-radius:var(--r-md);padding:7px 14px;font-weight:600;font-size:13px}
.tokhint{text-align:center;color:var(--muted);font-weight:500;font-size:14px;margin:12px 0}
.hist{margin:0 14px}
.hist div{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--divider);font-size:14px;color:var(--ink)}
.hist div small{display:block;color:var(--subtle);font-size:12px;margin-top:2px}
.hist div b{color:var(--gold-deep)}

/* ---------- Team ---------- */
.lead{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--border-strong);background:var(--app-bg);border-radius:var(--r-lg);padding:12px;margin-top:12px}
.lead .ic{color:var(--subtle);width:18px;height:18px}
.lead b{display:block;font-size:14.5px;font-weight:500;color:var(--ink)}
.lead span{font-size:13px;color:var(--subtle)}
.carousel{display:flex;align-items:center;gap:4px;margin-top:12px}
.carousel .arr{width:32px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--border-strong)}
.carousel .arr.on{color:var(--ink)}
.slides{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:var(--r-lg)}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;border:1px solid var(--border);background:var(--app-bg);border-radius:var(--r-lg);padding:14px;display:flex;align-items:center;justify-content:space-between}
.slide b{display:block;font-size:15px;font-weight:600;color:var(--ink)}
.slide span{font-size:13px;color:var(--subtle)}
.slide span.prog{color:var(--blue);font-weight:500}
.slide span.donec{color:var(--green);font-weight:500}
.btn{background:var(--blue);color:#fff;border-radius:var(--r-md);padding:10px 18px;font-weight:600;font-size:14px;min-height:40px}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--border-strong)}
.dots i.on{background:var(--blue)}
.progress{height:6px;background:var(--chip);border-radius:3px;margin:8px 0 12px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .3s}
.pill{background:var(--blue);color:#fff;border-radius:999px;font-size:12px;font-weight:600;padding:4px 10px}
.duesoon{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--ink);font-weight:500;padding-bottom:6px}

/* ---------- Menu ---------- */
.mlist{background:#fff;border-radius:var(--r-lg);margin:4px 12px 0;border:1px solid var(--border);overflow:hidden}
.mlist button{display:flex;align-items:center;gap:14px;width:100%;padding:0 14px;min-height:54px;border-bottom:1px solid var(--divider);font-size:15.5px;color:var(--ink);font-weight:500}
.mlist button:last-child{border-bottom:0}
.mlist button .ic{color:var(--blue)}
.mlist button .chev{margin-left:auto;color:var(--border-strong)}
.mgroup{font-size:12px;letter-spacing:.12em;font-weight:600;color:var(--blue);margin:18px 16px 8px;text-transform:uppercase}

/* ---------- Sheets ---------- */
#sheetLayer{position:absolute;inset:0;z-index:50;pointer-events:none}
#sheetLayer.on{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(9,22,45,.42);opacity:0;transition:opacity .26s}
#sheetLayer.on .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .34s var(--ease);max-height:86%;display:flex;flex-direction:column;box-shadow:var(--shadow-3)}
.sheet.gray{background:var(--app-bg)}
#sheetLayer.on .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--border-strong);margin:8px auto 4px;flex:none}
.shead{display:flex;align-items:center;justify-content:space-between;padding:4px 10px 10px;border-bottom:1px solid var(--divider);flex:none}
.shead h3{margin:0;font-size:17px;font-weight:600;color:var(--ink);flex:1;text-align:center}
.shead .x{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--subtle)}
.shead .done{width:60px;color:var(--blue);font-weight:600;font-size:15px;text-align:right;padding-right:6px;height:44px}
.sbody{overflow-y:auto;flex:1;scrollbar-width:none}
.sbody::-webkit-scrollbar{display:none}
.radio{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 18px;min-height:52px;border-bottom:1px solid var(--divider);font-size:16px;color:var(--ink)}
.radio span small{color:var(--subtle);font-size:15px}
.radio i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center}
.radio.on i{border-color:var(--blue)}
.radio.on i::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--blue)}
.sfoot{padding:14px 16px 34px;flex:none}
.sfoot .btn{width:100%;text-align:center;font-size:16px;min-height:48px}
.leadsheet h3{font-size:20px;font-weight:600;color:var(--ink);margin:10px 16px 14px}
.leadsheet h3 span{font-weight:400;color:var(--muted)}
.shift{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:var(--r-lg);margin:0 16px 40px;padding:14px;width:calc(100% - 32px);box-shadow:var(--shadow-1)}
.shift b{font-size:17px;font-weight:600;color:var(--ink)}
.shift b span{font-weight:400;color:var(--muted);font-size:14px}
.shift .u{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin-top:8px}
.shift .u i{width:28px;height:28px;border-radius:50%;background:var(--app-bg);display:flex;align-items:center;justify-content:center}
.shift .u .ic{width:15px;height:15px}
.calm{padding:4px 12px 30px}
.calm h4{font-size:21px;font-weight:600;color:var(--ink);margin:16px 6px 8px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;row-gap:4px}
.calg .dow{font-size:13px;color:var(--subtle);padding:10px 0;border-bottom:1px solid var(--divider);margin-bottom:6px}
.calg button{height:44px;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink)}
.calg button.past{color:var(--subtle)}
.calg button.on span{background:var(--blue);color:#fff}
.calg button span{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.calg button.today span{box-shadow:inset 0 0 0 1.5px var(--blue)}
.confirm{padding:8px 20px 34px;text-align:center}
.confirm h3{margin:10px 0 6px;font-size:20px;color:var(--ink)}
.confirm p{color:var(--muted);font-size:15px;margin:0 0 18px;line-height:1.45}
.confirm .row{display:flex;gap:10px}
.confirm .row .btn{flex:1;min-height:48px;font-size:16px;text-align:center}

/* ---------- Toast / attract ---------- */
#toast{position:absolute;left:50%;bottom:100px;transform:translate(-50%,20px);background:var(--dark-blue);color:#fff;font-size:14px;font-weight:500;padding:12px 18px;border-radius:var(--r-lg);opacity:0;transition:all .26s var(--ease);z-index:60;pointer-events:none;display:flex;align-items:center;gap:14px;white-space:nowrap;box-shadow:var(--shadow-3)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--medium-blue);font-weight:700}
#attract{position:absolute;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;padding-bottom:130px;background:rgba(9,22,45,.18);opacity:0;pointer-events:none;transition:opacity .4s}
#attract.on{opacity:1;pointer-events:auto}
#attract div{background:var(--blue);color:#fff;font-weight:600;font-size:18px;padding:16px 26px;border-radius:var(--r-lg);box-shadow:var(--shadow-3);display:flex;align-items:center;gap:10px;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* ================= Batch 2 ================= */
#screen{--kb:0px}
#screen.kbon{--kb:292px}
#views{bottom:var(--kb);transition:bottom .25s var(--ease)}
.sheet{bottom:var(--kb)}
#screen.kbon .sheet{border-radius:22px 22px 0 0}
#screen.kbon #tabbar{transform:translateY(160px);opacity:0;pointer-events:none}

/* on-screen keyboard */
#kb{position:absolute;left:0;right:0;bottom:0;height:292px;background:#d1d4da;z-index:65;transform:translateY(100%);transition:transform .25s var(--ease);padding:8px 3px 0;display:flex;flex-direction:column}
#screen.kbon #kb{transform:none}
#kb .sug{display:flex;height:36px;margin:0 0 6px;color:#1a1d21;font-size:16px}
#kb .sug span{flex:1;display:flex;align-items:center;justify-content:center;border-right:1px solid #b9bcc2}
#kb .sug span:last-child{border:0}
#kb .kr{display:flex;justify-content:center;gap:6px;margin-bottom:11px;padding:0 3px}
#kb .k{flex:0 0 calc((100% - 54px)/10);height:44px;background:#fff;border-radius:6px;box-shadow:0 1px 0 #898a8d;font-size:22px;color:#000;display:flex;align-items:center;justify-content:center;text-align:center}
#kb .k.fn{background:#abb0ba;flex:0 0 44px;font-size:16px}
#kb .k.wide{flex:0 0 88px}
#kb .k.space{flex:1}
#kb .k.go{background:var(--blue);color:#fff;flex:0 0 88px}
#kb .k.on{background:#fff}
#kb .k:active{background:#abb0ba}
#kb .kr.mid{padding:0 22px}
#kb .kr.mid .k{flex:0 0 calc((100% - 48px)/9)}
#kb .kr.third .k:not(.fn){flex:0 0 calc((100% - 152px)/7)}

/* fake inputs */
.fin{display:flex;align-items:center;width:100%;min-height:46px;border:1px solid var(--border);border-radius:var(--r-lg);padding:0 14px;background:#fff;font-size:15px;color:var(--fg);gap:10px;text-align:left}
.fin.focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--light-blue)}
.fin .ph{color:#8a8f96}
.fin.area{align-items:flex-start;min-height:120px;padding:12px 14px;white-space:pre-wrap;word-break:break-word}
.fin .val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fin.area .val{white-space:pre-wrap}
.caret{display:inline-block;width:2px;height:19px;background:var(--blue);vertical-align:middle;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.fin .ic{width:18px;height:18px;color:var(--subtle)}
.search.fin{margin:12px 12px 4px;height:46px;width:calc(100% - 24px)}

/* forms */
.flabel{font-size:15px;color:var(--muted);margin:16px 0 8px}
.flabel em{color:var(--red-dot);font-style:normal}
.form{padding:0 18px 24px}
.pickav{width:56px;height:56px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--dark-blue);background:#fff}
.pickav .ic{width:24px;height:24px}
.pickrow{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink);font-weight:500}
.tokchips{display:flex;gap:10px}
.tokchips button{display:flex;align-items:center;gap:6px;height:44px;padding:0 20px;border:1px solid var(--border);border-radius:999px;color:var(--gold-deep);font-weight:600;font-size:15px}
.tokchips button.on{background:#fff6e3;border-color:var(--gold-deep)}
.shead .send{width:60px;color:var(--blue);font-weight:600;font-size:15px;text-align:right;padding-right:6px;height:44px}
.shead .send:disabled{color:#b3b9c2}
.rowlink{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--border);border-radius:var(--r-lg);padding:0 14px;min-height:54px;margin-top:14px;font-size:16px;font-weight:600;color:var(--ink)}
.rowlink .chev{margin-left:auto}
.dateline{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;color:var(--ink)}
.select{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;border:1px solid var(--border);border-radius:var(--r-lg);padding:0 14px;font-size:15px}
.select .ph{color:#8a8f96;flex:1}
.select .v{color:var(--ink);font-weight:500;flex:1}
.optlist{border:1px solid var(--border);border-radius:var(--r-lg);margin-top:6px;overflow:hidden}
.optlist button{display:block;width:100%;padding:13px 14px;border-bottom:1px solid var(--divider);font-size:15px;color:var(--ink)}
.optlist button:last-child{border:0}

/* avatars & members */
.av{width:46px;height:46px;border-radius:50%;color:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none}
.av.s{width:30px;height:30px;font-size:11px}
.av.xs{width:24px;height:24px;font-size:10px}
.mrow{display:flex;align-items:center;gap:14px;width:100%;padding:8px 18px;min-height:62px;font-size:16px;color:var(--ink);font-weight:500}
.mrow .cb{margin-left:auto;width:22px;height:22px;border:1.5px solid var(--border-strong);border-radius:5px;display:flex;align-items:center;justify-content:center}
.mrow .cb.on{background:var(--blue);border-color:var(--blue);color:#fff}
.mrow .cb .ic{width:14px;height:14px;stroke-width:3}
.grplbl{font-size:15px;color:var(--muted);padding:14px 18px 4px}

/* chat */
.chsec{background:var(--app-bg);color:var(--muted);font-size:15px;padding:9px 18px}
.chadd{display:flex;align-items:center;gap:14px;width:100%;padding:0 18px;min-height:52px;font-size:16px;color:var(--ink)}
.chadd .ic{width:20px;height:20px}
.chrow{display:flex;align-items:center;gap:12px;width:100%;padding:8px 18px;min-height:58px;border-bottom:1px solid var(--divider)}
.chrow .hash{width:38px;height:38px;border-radius:var(--r-lg);background:var(--light-blue);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none}
.chrow b{display:block;font-size:15.5px;color:var(--ink);font-weight:600}
.chrow span{font-size:13px;color:var(--subtle);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.thread{flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:8px;scrollbar-width:none}
.thread::-webkit-scrollbar{display:none}
.sys{text-align:center;font-size:12.5px;color:var(--subtle);margin:6px 0 10px}
.bub{max-width:76%;align-self:flex-end;background:var(--blue);color:#fff;border-radius:16px 16px 4px 16px;padding:9px 13px;font-size:15px;line-height:1.35;white-space:pre-wrap;word-break:break-word}
.bubt{align-self:flex-end;font-size:11px;color:var(--subtle);margin-top:-4px}
.composer{display:flex;align-items:center;gap:8px;padding:8px 10px 12px;border-top:1px solid var(--divider);background:#fff;flex:none}
.composer .fin{border-radius:22px;min-height:42px}
.sendbtn{width:42px;height:42px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.sendbtn:disabled{background:var(--chip);color:var(--subtle)}
.sendbtn .ic{width:18px;height:18px}

/* menu (real) */
.mhdr{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 12px;border-bottom:1px solid var(--divider);background:#fff}
.mhdr h1{margin:0;font-size:26px;font-weight:600;color:var(--ink)}
.mhdr .help{display:flex;align-items:center;gap:6px;color:var(--blue);font-weight:500;font-size:15px;min-height:44px}
.mhdr .help i{width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-style:normal;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.msub{font-size:24px;font-weight:600;color:var(--ink);margin:18px 16px 12px}
.actchips{display:flex;gap:12px;padding:0 12px;flex-wrap:wrap}
.actchips button{height:52px;padding:0 22px;border-radius:14px;font-size:16px;font-weight:500;display:flex;align-items:center;gap:8px}
.ac-green{background:#e3f5ea;color:#1f7a37}
.ac-red{background:#fde4e3;color:#c8302c}
.ac-orange{background:#fdf0dc;color:#b55e12}
.ac-blue{background:var(--light-blue);color:var(--blue)}
.vlist{padding:0 12px;display:flex;flex-direction:column;gap:8px}
.vlist button{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--border-strong);border-radius:var(--r-lg);padding:0 14px;min-height:54px;font-size:16.5px;font-weight:600;color:#10213f;background:#fff}
.vlist button .bub2{width:30px;height:30px;border-radius:50%;background:var(--light-blue);color:var(--blue);display:flex;align-items:center;justify-content:center}
.vlist button .bub2 .ic{width:17px;height:17px}
.vlist button .chev{margin-left:auto;color:var(--subtle)}
.vlist button .chev .ic{width:16px;height:16px}

/* broadcast */
.bc-who{display:flex;align-items:center;gap:12px;padding:16px 18px 8px}
.bc-who b{display:block;font-size:16px;color:var(--ink);font-weight:600}
.bc-who span{font-size:14px;color:var(--muted)}
.bc-text{padding:4px 18px 14px}
.bc-text .fin{border:0;padding:0;min-height:90px;box-shadow:none}
.bc-bar{display:flex;align-items:center;gap:20px;padding:10px 18px;border-top:1px solid var(--divider);border-bottom:1px solid var(--divider);color:var(--muted);font-size:15px}
.bc-bar .to{margin-left:auto}
.bc-bar .to b{color:var(--blue);font-weight:600}
.bcard{border:1px solid var(--border);border-radius:var(--r-lg);padding:12px;margin-top:10px}
.bcard .h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.bcard .h b{color:var(--ink);font-weight:600}
.bcard p{margin:8px 0 0;font-size:14.5px;color:var(--fg);line-height:1.4;white-space:pre-wrap}

/* assign */
.asgn{padding:14px 18px}
.datechip{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 18px;border-radius:999px;background:#fff;border:1px solid var(--border);font-size:16px;font-weight:600;color:var(--ink)}
.asbox{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:4px 18px 18px;box-shadow:var(--shadow-1)}
.dashplus{width:46px;height:46px;border-radius:50%;border:1.5px dashed var(--blue);background:var(--light-blue);color:var(--blue);display:flex;align-items:center;justify-content:center}
.chosen{display:inline-flex;align-items:center;gap:10px;background:var(--light-blue);color:var(--dark-blue);border-radius:999px;padding:8px 14px;font-weight:600;font-size:15px}
.chosen .ic{width:16px;height:16px}
.bigbtn{display:block;width:100%;min-height:50px;border-radius:var(--r-lg);background:var(--blue);color:#fff;font-weight:600;font-size:16px;text-align:center;margin-top:18px}
.bigbtn:disabled{background:#e6ecf5;color:#aeb8c6}

/* setup builder */
.sbhdr{display:flex;align-items:center;gap:6px;height:64px;padding:0 10px;background:#fff;flex:none;border-bottom:1px solid var(--divider)}
.sbhdr .ttl{flex:1;text-align:left;min-height:52px}
.sbhdr .ttl small{display:block;font-size:13px;color:var(--muted)}
.sbhdr .ttl b{display:flex;align-items:center;gap:6px;font-size:18px;color:var(--ink);font-weight:500}
.sbhdr .ttl b .ic{width:16px;height:16px}
.cols{flex:1;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:16px 50px 16px 50px;scrollbar-width:none;align-items:stretch}
.cols::-webkit-scrollbar{display:none}
.col{flex:0 0 290px;scroll-snap-align:center;background:#fff;border-radius:14px;box-shadow:var(--shadow-2);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border)}
.colhd{display:flex;align-items:center;gap:8px;padding:12px 10px 12px 14px;border-bottom:1px solid var(--divider)}
.colhd b{flex:1;font-size:19px;font-weight:600;color:var(--ink)}
.grip{color:var(--border-strong);display:grid;grid-template-columns:4px 4px;gap:3px}
.grip i{width:4px;height:4px;border-radius:50%;background:currentColor}
.colbody{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px;scrollbar-width:none}
.colbody::-webkit-scrollbar{display:none}
.pos{background:#fafbfc;border:1px solid var(--border);border-radius:var(--r-lg);padding:10px 8px 8px}
.pos .ph{display:flex;align-items:center;gap:8px;padding:0 2px 8px}
.pos .ph b{flex:1;font-size:16px;font-weight:500;color:var(--ink)}
.pos .cnt{display:flex;align-items:center;gap:3px;background:var(--chip);border-radius:8px;padding:2px 7px;color:var(--subtle);font-size:13px}
.pos .cnt .ic{width:13px;height:13px}
.slot{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:48px;background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:6px;font-size:15px;color:var(--ink);font-weight:500}
.slot .n{width:30px;height:30px;border-radius:50%;background:var(--chip);color:var(--subtle);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500}
.slot.filled{justify-content:flex-start;padding:0 10px}
.slot.filled .x{margin-left:auto;color:var(--subtle)}
.slot.filled .x .ic{width:16px;height:16px}
.addemp{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:40px;border:1px solid var(--blue);border-radius:var(--r-lg);background:#edf4fc;color:var(--blue);font-size:15px;font-weight:500}
.addemp .ic{width:16px;height:16px}
.colft{padding:12px;border-top:1px solid var(--divider)}
.colft button{width:100%;min-height:46px;border:1px solid var(--blue);border-radius:24px;color:var(--blue);font-size:16px;font-weight:500;text-align:center}
.fab{position:absolute;right:14px;bottom:44px;height:48px;padding:0 18px;border-radius:24px;background:var(--blue);color:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-3);z-index:5}
.fab .ic{width:18px;height:18px}
.slide .who{display:flex;align-items:center;gap:8px;color:var(--blue);font-weight:600;font-size:15px}
.slide .who i{width:32px;height:32px;border-radius:50%;background:var(--light-blue);display:flex;align-items:center;justify-content:center}
.slide .who .ic{width:16px;height:16px}
.slide span.draft{color:#b56f12}

/* team extras */
.breaks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.breaks div{border-radius:var(--r-lg);text-align:center;padding:12px 4px}
.breaks b{display:block;font-size:22px;font-weight:500}
.breaks span{font-size:13px}
.statrow{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:8px;padding:14px 12px 4px}
.statrow div{border:1px solid var(--border-strong);border-radius:12px;padding:10px 12px;background:#fff}
.statrow span{display:block;font-size:13px;color:var(--ink);line-height:1.25}
.statrow b{font-size:22px;color:var(--ink);font-weight:600}
.statrow b small{color:var(--subtle);font-weight:400;font-size:20px}
.viewmore{display:block;width:100%;text-align:center;color:var(--blue);font-size:15px;padding:14px 0}
.accitem{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--divider)}
.accitem b{display:block;color:var(--ink);font-weight:600;font-size:15px}
.accitem span{color:var(--muted);font-size:13px}
.accitem .tag{margin-left:auto;background:#fde4e3;color:#c8302c;border-radius:var(--r-md);font-size:12px;font-weight:600;padding:4px 8px}
.applybtn:disabled{background:#e6e8ec;color:#fff}
.radio.custom i{border:0}

/* ================= Batch 3 ================= */
.calg button:disabled{opacity:.4;cursor:default}
.duetime{border-top:1px solid var(--divider);padding:14px 18px 28px;background:#fff;flex:none}
.duetime b{font-size:16px;color:var(--ink);font-weight:600}
.tgl{width:52px;height:30px;border-radius:15px;background:#e3e7ed;position:relative;flex:none;transition:background .2s}
.tgl i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s var(--ease)}
.tgl.on{background:var(--blue)}
.tgl.on i{transform:translateX(22px)}
.chosen{background:#fff;border:1px solid var(--border);color:var(--ink);font-weight:400;font-size:16px;padding:10px 18px 10px 14px;min-height:52px}
.chosen .ic{width:20px;height:20px}
.asfoot{padding:12px 18px 30px;background:var(--app-bg);flex:none}
.addanother{display:flex;align-items:center;gap:10px;color:var(--blue);font-size:16px;font-weight:500;min-height:48px}
.modesel{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:54px;border:1px solid var(--border);border-radius:var(--r-lg);padding:0 16px 0 18px;font-size:18px;color:var(--ink);background:#fff}
.modesel .ic{color:var(--subtle);width:16px;height:16px}

.dacard span{display:block;font-size:13.5px;color:var(--muted)}
.dacard small{display:block;font-size:12px;color:var(--subtle);margin-top:2px}
.periodcard{display:block;width:100%;background:#fff;border-radius:18px;padding:16px;text-align:left;box-shadow:var(--shadow-1)}
.periodcard b{font-size:19px;color:var(--ink);font-weight:600}
.periodcard .ic{color:var(--subtle)}
.periodval{display:flex;align-items:center;gap:12px;background:#edf3fb;border-radius:10px;padding:14px;margin-top:10px;font-size:16px;color:var(--ink)}
.rec{background:#e3f5ea;color:#1f8a46;font-size:13px;font-weight:500;padding:4px 8px;border-radius:6px}
.ptrow{display:flex;align-items:center;gap:20px;background:#fafbfc;border-radius:12px;margin:0 12px 8px;padding:12px 14px}
.ptrow .pt{width:40px;height:40px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px;flex:none}
.ptrow .pn{font-size:16px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow-1);display:block;text-align:left}
.rh{display:block;font-size:18px;color:var(--ink);font-weight:600;margin-bottom:12px}
.rpair{display:grid;grid-template-columns:1fr 1px 1fr;gap:16px;align-items:start}
.rpair>i{background:var(--border-strong);height:36px}
.rpair div{text-align:center}
.rv{display:block;background:var(--chip);border-radius:6px;padding:6px;font-size:20px;color:var(--ink);font-weight:600}
.rpair small{display:block;font-size:12.5px;color:var(--muted);margin-top:8px}
.rduo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rduo .rcard{margin-bottom:10px}
.rbtn{display:flex !important;align-items:center;gap:10px;width:100%}
.rbtn b{font-size:15px;color:var(--ink);font-weight:600;line-height:1.25;text-align:center;flex:1}
.rico{width:42px;height:42px;border-radius:50%;background:#eef0fb;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.topinf{margin-bottom:10px}
.topinf>div:first-child{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink);gap:8px}
.topinf .hb{height:8px;background:var(--chip);border-radius:4px;margin-top:4px;overflow:hidden}
.topinf .hb i{display:block;height:100%;background:var(--blue);border-radius:4px}
.rrow{display:flex;justify-content:space-between;align-items:center;background:var(--chip);border-radius:6px;padding:8px 8px;margin-bottom:6px;font-size:13.5px;color:var(--muted)}
.rrow b{font-weight:500;color:#9aa1ab}
.rrow.has b{color:var(--ink)}
.rrow.blue{background:#edf3fb}
.rrow.blue b{color:var(--blue)}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:12px;padding:3px;margin:0 16px 14px}
.seg2 button{height:44px;border-radius:10px;font-size:17px;color:var(--ink);text-align:center}
.seg2 button.on{background:#fff;color:var(--blue);box-shadow:var(--shadow-1)}
.rolerow{display:flex;align-items:center;gap:16px;width:100%;padding:12px 16px;text-align:left}
.rolerow .rn{width:36px;height:36px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px}
.rolerow b{font-size:17px;color:var(--ink);font-weight:500}
.rulecard{display:block;width:calc(100% - 32px);margin:0 16px 12px;border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 14px;text-align:left}
.rulecard>b{font-size:17px;color:var(--ink);font-weight:600}
.rulecard p,.rulepreview{margin:8px 0 0;font-size:15px;color:var(--muted);line-height:1.5}
.rulecard p b,.rulepreview b{color:var(--ink);font-weight:600}
.rulecard p g,.rulepreview g{color:#1f8a46;font-weight:600}
.rulepreview{background:var(--app-bg);border-radius:var(--r-lg);padding:12px 14px;margin-top:18px}
.tgline{display:flex;align-items:center;gap:12px;margin-top:14px;font-size:16px;color:var(--ink)}
.addround{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--blue);color:var(--blue);display:flex;align-items:center;justify-content:center}
.brcard{border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;margin-top:14px}
.dpcard{border:1px solid var(--border);border-radius:16px;margin:0 16px 14px;padding:12px 16px 16px}
.tfrow{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:10px;padding:8px 8px 8px 12px;margin-top:8px;font-size:16px;color:var(--muted);font-weight:500}
.tchip{background:var(--app-bg);border:1px solid var(--border);border-radius:6px;min-width:130px;height:40px;font-size:17px;color:var(--ink);text-align:center}
.daytabs{display:flex;background:#fff;border-bottom:1px solid var(--divider)}
.daytabs button{flex:0 0 22%;padding:14px 0;font-size:16px;color:var(--ink);text-align:center;border-bottom:3px solid transparent}
.daytabs button.on{border-color:var(--blue);color:var(--blue)}
.copyday{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 24px);margin:0 12px 12px;background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);min-height:48px;color:var(--blue);font-size:17px}
.tplcard{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);margin:0 12px 12px;padding:12px 14px}
.tplcard>div>b{font-size:19px;color:var(--ink);font-weight:500}
.tplrow{display:flex;align-items:center;justify-content:space-between;width:100%;border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 14px;margin-top:10px;text-align:left;color:var(--muted)}
.tplrow b{display:block;font-size:16.5px;color:var(--ink);font-weight:500}
.tplrow span{font-size:14.5px;color:var(--muted)}
.teamcard{position:relative;background:#fafbfc;border-radius:14px;margin:0 16px 14px;padding:12px 14px 4px 16px}
.teamcard::before{content:"";position:absolute;left:0;top:14px;width:4px;height:22px;border-radius:0 3px 3px 0;background:var(--tc)}
.teamcard .th{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--border)}
.teamcard .th b{font-size:18px;color:var(--ink);font-weight:600}
.leadpill{display:inline-flex;align-items:center;gap:6px;background:var(--chip);color:var(--muted);border-radius:8px;padding:5px 10px;font-size:14.5px;min-height:32px}
.leadpill.has{background:var(--light-blue);color:var(--dark-blue);font-weight:500}
.teamcard .tm{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;font-size:14px;color:var(--muted)}
.avstack{display:inline-flex;align-items:center}
.avstack .av{margin-left:-7px;border:2px solid #fff}
.avstack .av:first-child{margin-left:0}
.avstack em{font-style:normal;font-size:13px;color:var(--muted);margin-left:4px}
.areacard{background:#fff;border-radius:14px;margin:0 16px 16px;box-shadow:var(--shadow-1);overflow:hidden}
.areacard .ab{display:block;width:100%;text-align:left;padding:16px 18px 14px}
.areacard .ab b{display:block;font-size:18px;color:var(--ink);font-weight:500}
.ae{display:block;font-size:15px;color:#9aa1ab;margin-top:8px}
.achips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.achips i{font-style:normal;font-size:13.5px;color:var(--ink);padding:5px 10px;border-radius:8px}
.arow{display:flex;align-items:center;gap:8px;border-top:1px solid var(--border);margin:0 18px;padding:12px 0 16px}
.arow .more{font-style:normal;font-size:16px;color:var(--muted);margin-left:2px}
.ckrow{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:58px;font-size:17px;color:var(--ink)}
.ckrow .cb{width:26px;height:26px;border:1.5px solid var(--border-strong);border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff}
.ckrow .cb.on{background:var(--blue);border-color:var(--blue)}
.ckrow .cb .ic{width:16px;height:16px;stroke-width:3}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 18px 0}
.steps i{height:5px;border-radius:3px;background:var(--chip)}
.steps i.on{background:var(--blue)}

/* ================= Staffed restaurant ================= */
.lrow{min-height:50px}
.lrow .name small{display:block;font-size:11.5px;color:var(--subtle);font-weight:400;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .add .av.xs{width:26px;height:26px;font-size:10px}
.lrow.done .kind{color:var(--green)}
.lrow.done .name{text-decoration:none;color:var(--subtle)}
.lrow.done .time{color:var(--subtle)}
.lrow.late .time,.lrow.late .name small{color:var(--red)}
span.av{color:#fff !important;display:flex !important;font-size:15px !important;max-width:none !important;margin-top:0 !important;font-weight:600 !important;line-height:1 !important}
span.av.s{font-size:11px !important}
span.av.xs{font-size:10px !important}

/* ================= Add equipment / cloud connector ================= */
.menuopt{display:flex;align-items:center;gap:16px;width:100%;background:#fff;border-radius:14px;padding:0 18px;min-height:58px;font-size:16px;font-weight:600;color:var(--blue);box-shadow:var(--shadow-1)}
.menuopt .ic{width:22px;height:22px;color:var(--blue)}
.steps i.part{position:relative;overflow:hidden;background:#e6ecf5}
.steps i.part b{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:3px;transition:width .4s var(--ease)}
.wizh{font-size:24px;font-weight:600;color:var(--ink);line-height:1.25;margin:18px 0 10px}
.viewfinder{position:relative;display:block;width:250px;height:250px;margin:50px auto 0;border-radius:22px;overflow:hidden;border:1.5px solid #d5dbe3;background:#1b1f25}
.viewfinder .vfbg{position:absolute;inset:0;background:radial-gradient(120% 90% at 30% 20%,#5b4a3a 0%,#2b2622 55%,#15171b 100%)}
.viewfinder .qrmock{position:absolute;left:50%;top:50%;width:110px;height:110px;margin:-55px 0 0 -55px;background:#fff;padding:8px;border-radius:6px;transform:rotate(-6deg);box-shadow:0 6px 20px rgba(0,0,0,.45);opacity:.92}
.viewfinder .c{position:absolute;width:34px;height:34px;border:4px solid #fff;opacity:.9}
.viewfinder .tl{left:18px;top:18px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.viewfinder .tr{right:18px;top:18px;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.viewfinder .bl{left:18px;bottom:18px;border-right:0;border-top:0;border-radius:0 0 0 10px}
.viewfinder .br{right:18px;bottom:18px;border-left:0;border-top:0;border-radius:0 0 10px 0}
.viewfinder .scanline{position:absolute;left:24px;right:24px;height:2px;background:#4fd1ff;box-shadow:0 0 12px 2px rgba(79,209,255,.7);animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{from{top:30px}to{top:216px}}
.viewfinder.found .c{border-color:#39d27a}
.viewfinder .vfok{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:#2fb36b;color:#fff;display:flex;align-items:center;justify-content:center;animation:fadeIn .25s var(--ease)}
.viewfinder .vfok .ic{width:34px;height:34px;stroke-width:3}
.vfhint{text-align:center;color:var(--muted);font-size:14px;margin-top:14px}
.scanlink{display:block;margin:24px auto 34px;color:var(--blue);font-weight:500;font-size:15px;text-align:center}
.donebig{display:inline-flex;width:76px;height:76px;border-radius:50%;background:#e3f5ea;color:#1f8a46;align-items:center;justify-content:center}
.donebig .ic{width:40px;height:40px;stroke-width:2.5}

function tempRecords(R){

/* ---------- Rendering ---------- */
const views=document.getElementById("views"), screenEl=document.getElementById("screen");
function makeView(entry){
  const def=SCREENS[entry.s], v=document.createElement("div");
  v.className="view"+(def.white?" white":""); v.dataset.s=entry.s; v.innerHTML=def.render(); return v;
}
function tabbar(){
  const t=document.getElementById("tabbar"), def=SCREENS[cur().s];
  t.className=def.tabbar?"":"hidden";
  t.innerHTML=[["home","Home","home"],["team","Team","team"],["chat","Chat","chat"],["menu","Menu","menu"]].map(([k,l,i])=>`<button class="${S.tab===k?"on":""}" data-act="tab" data-arg="${k}">${ic(i)}${l}</button>`).join("");
}
function after(){tabbar(); bindSlides(); {const v=views.lastElementChild, o=v&&v.querySelector("#daytabs .on"); if(o){const p=o.parentElement; p.scrollLeft=o.offsetLeft-(p.clientWidth-o.offsetWidth)/2}} const th=views.lastElementChild&&views.lastElementChild.querySelector("#thread"); if(th)th.scrollTop=th.scrollHeight}
function mount(anim){
  const old=[...views.children];
  const v=makeView(cur()); if(anim)v.classList.add(anim); views.appendChild(v);
  if(anim==="enter"){old.forEach(o=>{o.classList.add("under");setTimeout(()=>o.remove(),340)})}
  else old.forEach(o=>o.remove());
  after();
}
function refresh(){
  const v=views.lastElementChild; if(!v)return mount();
  const sc=[...v.querySelectorAll(".scroll,.hscroll,.slides,.cols,.colbody")].map(e=>[e.scrollTop,e.scrollLeft]);
  v.innerHTML=SCREENS[cur().s].render();
  [...v.querySelectorAll(".scroll,.hscroll,.slides,.cols,.colbody")].forEach((e,i)=>{if(sc[i]){e.scrollTop=sc[i][0];e.scrollLeft=sc[i][1]}});
  after();
  if(S.sheets.length)drawSheet();
}
function push(s,extra={}){kbClose(); S.stacks[S.tab].push({s,...extra}); mount("enter")}
function pop(){
  kbClose();
  const st=S.stacks[S.tab]; if(st.length<2)return;
  st.pop(); const top=views.lastElementChild;
  const under=makeView(cur()); views.insertBefore(under,top);
  top.classList.add("leave"); after();
  setTimeout(()=>top.remove(),300);
}
function openSheet(type,extra={}){kbClose(); S.sheets.push({type,...extra}); drawSheet(); document.getElementById("sheetLayer").classList.add("on")}
function drawSheet(){
  const t=sh(); if(!t)return; const el=document.getElementById("sheet"),r=SHEETS[t.type](t);
  const sb=el.querySelector(".sbody"), st=sb?sb.scrollTop:0, same=el.dataset.type===t.type;
  el.className="sheet"+(r.gray?" gray":""); el.style.height=r.full?"88%":""; el.innerHTML=r.html; el.dataset.type=t.type;
  const nb=el.querySelector(".sbody"); if(nb&&same)nb.scrollTop=st;
}
function closeSheet(all){kbClose(); if(all)S.sheets=[]; else S.sheets.pop();
  if(S.sheets.length){drawSheet()} else {document.getElementById("sheetLayer").classList.remove("on"); document.getElementById("sheet").dataset.type=""}}
let toastT,lastUndo=null;
function toast(msg,undo){
  const t=document.getElementById("toast"); t.innerHTML=esc(msg)+(undo?'<button data-act="undo">Undo</button>':"");
  t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2600); lastUndo=undo||null;
}
function bindSlides(){
  const v=views.lastElementChild, sl=v&&v.querySelector("#slides"); if(!sl)return;
  const upd=()=>{const i=Math.round(sl.scrollLeft/sl.clientWidth); const ds=v.querySelectorAll("#dots i"); ds.forEach((d,j)=>d.classList.toggle("on",j===i));
    const arr=v.querySelectorAll(".carousel .arr"); arr[0].classList.toggle("on",i>0); arr[1].classList.toggle("on",i<ds.length-1)};
  sl.addEventListener("scroll",upd,{passive:true}); upd();
}

kbEl.addEventListener("pointerdown",e=>{
  const b=e.target.closest("[data-kb]"); if(!b||!S.kb)return; e.preventDefault();
  const key=b.dataset.kb, f=S.kb.field; let v=S.f[f]||"";
  if(key==="done"){ if(f==="msg"&&v.trim()){A.sendMsg();return} kbClose(); return }
  if(key==="shift"){S.kb.shift=!S.kb.shift; drawKb(); return}
  if(key==="num"){S.kb.num=!S.kb.num; drawKb(); return}
  if(key==="back")v=v.slice(0,-1);
  else { v+=(S.kb.shift&&!S.kb.num)?key.toUpperCase():key; if(S.kb.shift){S.kb.shift=false;} }
  if(v.length>240)return;
  S.f[f]=v; if(f.startsWith("dpName"))S.dpDirty=true; drawKb(); rerender();
});

  scanManualGo(k){kbClose(); A.scanComplete(k)},
  scanComplete(k){
    if(k==="cc"){ if(cur().s!=="addcc")return; S.connectors.push({name:S.f.ccName.trim()}); S.f.ccStep=3; }
    else { if(cur().s!=="addeq")return; const tp=EQUIPMENT_TEMPLATES.find(t=>t.name===S.f.eqTpl), n=EQUIPMENT.length+4;
      S.f.eqSensor=tp.kind==="door"?"Open/Close":"Prep "+(n+5);
      EQUIPMENT.push({id:"x"+Date.now(),name:S.f.eqName.trim(),cat:tp.cat,sensor:S.f.eqSensor,kind:tp.kind,val:tp.val,lo:tp.lo,hi:tp.hi,state:tp.state,battery:100,signal:82,added:true});
      S.f.eqStep=3; }
    refresh()},
  ccDone(){pop(); toast(S.f.ccName.trim()+" connected"); setTimeout(refresh,320)},
  eqDone(){pop(); toast(S.f.eqName.trim()+" added"); setTimeout(()=>{refresh(); const s=views.lastElementChild.querySelector(".scroll"); if(s)s.scrollTo({top:s.scrollHeight,behavior:"smooth"})},340)},

  /* remote monitoring */
  openEq(a){push("eqdetail",{id:a})},
  openSensor(a){push("sensor",{id:a})},
  eqInfo(){S.eqInfo=!S.eqInfo; refresh()},
  eqInclude(a){S.eqInclude[a]=S.eqInclude[a]===false; refresh()},
  eqFlag(k){S[k]=!S[k]; refresh()},
  alertMode(a){S.alertMode=a; refresh()},
  eqRefresh(){toast("Sensor readings updated · "+nowTime())}
};
screenEl.addEventListener("click",e=>{
  if(e.target.closest("#kb"))return;
  const el=e.target.closest("[data-act]");
  if(!el){ if(S.kb&&!e.target.closest(".fin"))kbClose(); return }
  if(S.kb&&el.dataset.act!=="focus"&&el.dataset.act!=="sendMsg"&&!el.closest("#sheet .sbody .mrow"))kbClose();
  const f=A[el.dataset.act]; if(f)f(el.dataset.arg,el);
});

/* ---------- Drag to scroll (for mice and touch screens that send mouse events) ---------- */
(function(){
  const SEL=".hscroll,.slides,.cols,.scroll,.colbody,.sbody,.thread";
  let d=null, raf=0, suppress=false;
  const scale=()=>screenEl.getBoundingClientRect().width/screenEl.offsetWidth||1;
  const canX=el=>el.scrollWidth>el.clientWidth+1&&getComputedStyle(el).overflowX!=="hidden";
  const canY=el=>el.scrollHeight>el.clientHeight+1&&getComputedStyle(el).overflowY!=="hidden";
  function findScroller(start,axis){let el=start.closest(SEL);while(el&&screenEl.contains(el)){if(axis==="x"?canX(el):canY(el))return el;el=el.parentElement&&el.parentElement.closest(SEL)}return null}
  screenEl.addEventListener("pointerdown",e=>{
    if(e.pointerType==="touch"||e.button!==0||e.target.closest("#kb"))return;
    cancelAnimationFrame(raf);
    d={x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,lt:performance.now(),vx:0,vy:0,axis:null,el:null,target:e.target,id:e.pointerId,s:scale()};
  });
  window.addEventListener("pointermove",e=>{
    if(!d||e.pointerId!==d.id)return;
    const dx=e.clientX-d.x, dy=e.clientY-d.y;
    if(!d.axis){
      if(Math.hypot(dx,dy)<6)return;
      d.axis=Math.abs(dx)>Math.abs(dy)?"x":"y";
      d.el=findScroller(d.target,d.axis);
      if(!d.el){d=null;return}
      d.snap=d.el.style.scrollSnapType; d.el.style.scrollSnapType="none"; d.el.style.scrollBehavior="auto";
      d.sl=d.el.scrollLeft; d.st=d.el.scrollTop; document.body.classList.add("dragging"); suppress=true;
    }
    const now=performance.now(), dt=Math.max(1,now-d.lt);
    d.vx=(e.clientX-d.lx)/dt; d.vy=(e.clientY-d.ly)/dt; d.lx=e.clientX; d.ly=e.clientY; d.lt=now;
    if(d.axis==="x")d.el.scrollLeft=d.sl-dx/d.s; else d.el.scrollTop=d.st-dy/d.s;
  });
  function end(){
    if(!d)return; const g=d; d=null; document.body.classList.remove("dragging");
    if(!g.el){return}
    let v=(g.axis==="x"?g.vx:g.vy)/g.s*16; if(performance.now()-g.lt>80)v=0;
    const step=()=>{ if(Math.abs(v)<.4){g.el.style.scrollSnapType=g.snap||""; g.el.style.scrollBehavior=""; return}
      if(g.axis==="x")g.el.scrollLeft-=v; else g.el.scrollTop-=v; v*=.94; raf=requestAnimationFrame(step)};
    raf=requestAnimationFrame(step);
    setTimeout(()=>{suppress=false},0);
  }
  window.addEventListener("pointerup",end); window.addEventListener("pointercancel",end);
  screenEl.addEventListener("click",e=>{if(suppress){e.stopPropagation();e.preventDefault();suppress=false}},true);
  screenEl.addEventListener("dragstart",e=>e.preventDefault());
  // mouse wheel over a horizontal strip scrolls it sideways
  screenEl.addEventListener("wheel",e=>{const h=e.target.closest(".hscroll,.cols");if(h&&canX(h)&&Math.abs(e.deltaY)>Math.abs(e.deltaX)&&!e.shiftKey){h.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
})();

/* ---------- Kiosk: idle reset, hidden reset, scaling ---------- */
function resetAll(attract){
  for(let i=EQUIPMENT.length-1;i>=0;i--)if(EQUIPMENT[i].added)EQUIPMENT.splice(i,1);
  S=freshState(); screenEl.classList.remove("kbon");
  S.sheets=[]; document.getElementById("sheetLayer").classList.remove("on");
  views.innerHTML=""; mount();
  if(attract)document.getElementById("attract").classList.add("on"); else toast("Demo reset");
}
let idleT; const kick=()=>{clearTimeout(idleT); idleT=setTimeout(()=>resetAll(true),IDLE_SECONDS*1000)};
["pointerdown","keydown","wheel"].forEach(ev=>document.addEventListener(ev,kick,{passive:true}));
document.getElementById("attract").addEventListener("pointerdown",e=>{e.currentTarget.classList.remove("on");e.preventDefault()});
let holdT; document.addEventListener("pointerdown",e=>{if(e.target.closest(".logo"))holdT=setTimeout(()=>resetAll(false),2000)});
["pointerup","pointercancel","pointerleave"].forEach(ev=>document.addEventListener(ev,()=>clearTimeout(holdT)));
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("dblclick",e=>e.preventDefault());
document.addEventListener("keydown",e=>{
  if(S.kb){ // physical keyboard also types into the focused field
    if(e.key.length===1){S.f[S.kb.field]=(S.f[S.kb.field]||"")+e.key; rerender(); e.preventDefault(); return}
    if(e.key==="Backspace"){S.f[S.kb.field]=(S.f[S.kb.field]||"").slice(0,-1); rerender(); e.preventDefault(); return}
    if(e.key==="Enter"){ if(S.kb.field==="msg")A.sendMsg(); else kbClose(); return}
    if(e.key==="Escape"){kbClose(); return}
  }
  if(e.key==="f"||e.key==="F"){document.body.classList.toggle("frameless");fit()}
  if(e.key==="b"||e.key==="B"){document.body.classList.toggle("hidebrand");fit()}
  if(e.key==="r"||e.key==="R")resetAll(false);
  if(e.key==="Escape"&&S.sheets.length)closeSheet();
});
const qp=new URLSearchParams(location.search);
if(qp.get("frame")==="0")document.body.classList.add("frameless");
if(qp.get("brand")==="0")document.body.classList.add("hidebrand");
function fit(){
  const dev=document.getElementById("device"), w=dev.offsetWidth, h=dev.offsetHeight;
  const vw=innerWidth, vh=innerHeight, brand=!document.body.classList.contains("frameless")&&!document.body.classList.contains("hidebrand")&&vw/vh>1.2;
  document.getElementById("brandPanel").style.display=brand?"":"none";
  const s=Math.min((vh*.94)/h,(vw*(brand?.5:.94))/w);
  const wrap=document.getElementById("deviceWrap"); wrap.style.transform=`scale(${s})`;
  wrap.style.marginLeft=brand?`${vw*.3}px`:"0";
}
addEventListener("resize",fit);
function tick(){const d=new Date();let h=d.getHours()%12||12;document.getElementById("clock").textContent=h+":"+String(d.getMinutes()).padStart(2,"0")}
setInterval(tick,10000); tick();
mount(); fit(); kick();

</script>
